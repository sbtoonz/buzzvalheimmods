# OdinPlus Faction Configuration Example
# Copy this to: BepInEx/config/faction_config.yaml

Factions:
  Neutral:
    Name: Neutral
    Allies: []
    Enemies: []

  RedTeam:
    Name: RedTeam
    Allies:
      - GreenTeam
    Enemies:
      - BlueTeam

  BlueTeam:
    Name: BlueTeam
    Allies: []
    Enemies:
      - RedTeam

  GreenTeam:
    Name: GreenTeam
    Allies:
      - RedTeam
    Enemies: []

  # Example: Add more factions
  # YellowTeam:
  #   Name: YellowTeam
  #   Allies:
  #     - RedTeam
  #   Enemies:
  #     - BlueTeam

# Reputation thresholds (global defaults)
ReputationEvents:
  Hostile: -30
  Unfriendly: -10
  Neutral: 10
  Friendly: 30
  Honored: 50

# Village/NPC Spawn Locations
# NPCs will spawn at ALL listed locations when they are loaded by the game
# See LOCATION_NAMES.md for complete list of 160+ location names

# STARTER CONFIG (Meadows only)
VillageLocations:
  - WoodFarm1

